name: Build Forge 1.20.1 mod

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build
        run: gradle --stacktrace --no-daemon build

      - name: Upload mod jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: opac-warfare-forge-1.20.1-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
